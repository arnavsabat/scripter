<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Spike demo</title>
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Courier+Prime:wght@400;700&display=swap"
    />
    <style>
      body {
        margin: 16px;
        font:
          13px -apple-system,
          BlinkMacSystemFont,
          'Helvetica Neue',
          sans-serif;
        background: #e9e9ec;
      }
      .bar {
        display: flex;
        gap: 16px;
        align-items: center;
        margin-bottom: 12px;
      }
      .bar label {
        display: flex;
        gap: 6px;
        align-items: center;
      }
      .names {
        display: flex;
        gap: 16px;
        font-weight: 600;
        margin-bottom: 4px;
      }
      .names span {
        width: 836px;
      }
      .el::before {
        content: attr(data-type);
        position: absolute;
        left: 8px;
        font: 10px sans-serif;
        color: #999;
        text-transform: none;
      }
      .el {
        position: relative;
      }
      #status {
        color: #5f5f64;
      }
    </style>
  </head>
  <body>
    <div class="bar">
      <label
        >Schema
        <select id="variant">
          <option value="typeAttr">typeAttr (element type is an attribute)</option>
          <option value="nodeTypes">nodeTypes (one node type per element)</option>
        </select>
      </label>
      <button id="offline">Go offline</button>
      <span id="status">Online: edits sync immediately.</span>
    </div>
    <div class="names"><span>Writer A</span><span>Writer B</span></div>
    <div id="stage" class="stage"></div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
