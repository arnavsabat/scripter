# Local services for development. Start with `pnpm services:up`.
# Credentials here are for local development only and must never be reused anywhere else.
name: scripter

services:
  postgres:
    image: postgres:18.6
    environment:
      POSTGRES_USER: wr
      POSTGRES_PASSWORD: wr_dev_only
      POSTGRES_DB: scripter
    ports:
      - '5432:5432'
    volumes:
      # Postgres 18 images keep data under /var/lib/postgresql/<major>/, so mount the parent.
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U wr -d scripter']
      interval: 5s
      timeout: 3s
      retries: 10

  # Edit log, ownership leases and server membership (SPEC 5.4).
  dynamodb:
    image: amazon/dynamodb-local:3.3.1
    command: -jar DynamoDBLocal.jar -sharedDb -dbPath /home/dynamodblocal/data
    working_dir: /home/dynamodblocal
    user: root
    ports:
      - '8000:8000'
    volumes:
      - dynamodb-data:/home/dynamodblocal/data

  # S3-compatible store for compacted snapshots (SeaweedFS, decision log D-004).
  # SeaweedFS reserves 7 volumes per bucket and defaults to 8 per server, so a second bucket
  # fails with "no free volumes". Allow 100 small (64 MB) volumes; they aren't preallocated.
  s3:
    image: chrislusf/seaweedfs:4.48
    command: server -dir=/data -s3 -s3.port=8333 -s3.config=/etc/seaweedfs/s3.json -volume.max=100 -master.volumeSizeLimitMB=64
    ports:
      - '8333:8333'
    volumes:
      - s3-data:/data
      - ./infra/local/seaweedfs-s3.json:/etc/seaweedfs/s3.json:ro

  # Three sync servers forming a cluster (SPEC 5.1, D-022). Start with `pnpm cluster:up`.
  # Browsers reach them on localhost:4001-4003; the servers reach each other by service name.
  # They trust only the Cognito pool in .env (D-046), so they start once it exists (accounts step 8).
  sync-1: &sync
    profiles: [cluster]
    build: { context: ., dockerfile: apps/sync/Dockerfile }
    image: scripter-sync
    depends_on: [postgres, dynamodb, s3]
    environment: &sync-env
      WR_SERVER_ID: sync-1
      WR_INTERNAL_URL: ws://sync-1:4000
      PORT: '4000'
      WR_CLUSTER_SECRET: dev-only-cluster-secret
      DATABASE_URL: postgres://wr:wr_dev_only@postgres:5432/scripter
      COGNITO_REGION: ${COGNITO_REGION:-us-east-2}
      COGNITO_USER_POOL_ID: ${COGNITO_USER_POOL_ID:-}
      COGNITO_CLIENT_ID: ${COGNITO_CLIENT_ID:-}
      AWS_REGION: us-east-1
      DYNAMODB_ENDPOINT: http://dynamodb:8000
      S3_ENDPOINT: http://s3:8333
      S3_ACCESS_KEY_ID: wr_local
      S3_SECRET_ACCESS_KEY: wr_local_secret
      S3_SNAPSHOT_BUCKET: wr-snapshots
    ports: ['4001:4000']
    restart: 'no'
  sync-2:
    <<: *sync
    environment:
      <<: *sync-env
      WR_SERVER_ID: sync-2
      WR_INTERNAL_URL: ws://sync-2:4000
    ports: ['4002:4000']
  sync-3:
    <<: *sync
    environment:
      <<: *sync-env
      WR_SERVER_ID: sync-3
      WR_INTERNAL_URL: ws://sync-3:4000
    ports: ['4003:4000']

volumes:
  postgres-data:
  dynamodb-data:
  s3-data:
